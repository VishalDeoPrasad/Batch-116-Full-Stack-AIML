<!DOCTYPE html>
<html>
<head>
    <title>Contact List</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(120deg,#74ebd5,#9face6);
            margin:0;
            padding:0;
        }

        h1{
            text-align:center;
            color:#fff;
            margin-top:30px;
        }

        .container{
            width:80%;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }

        table{
            width:100%;
            border-collapse:collapse;
            text-align:left;
            overflow:hidden;
            border-radius:10px;
        }

        thead{
            background:#4a69bd;
            color:white;
            font-size:18px;
        }

        th, td{
            padding:14px 18px;
        }

        tbody tr{
            border-bottom:1px solid #eee;
            transition:0.3s;
        }

        tbody tr:nth-child(even){
            background:#f7f9fc;
        }

        tbody tr:hover{
            background:#dfe7fd;
            transform:scale(1.01);
        }

        th{
            letter-spacing:0.5px;
        }

        .empty{
            text-align:center;
            padding:20px;
            color:#888;
        }
    </style>
</head>

<body>

<h1>📩 Contact Submissions</h1>

<div class="container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>

        <tbody>
            {% for contact in contacts %}
            <tr>
                <td>{{ contact.name }}</td>
                <td>{{ contact.mobile }}</td>
                <td>{{ contact.email }}</td>
                <td>{{ contact.message }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="empty">No contacts yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
