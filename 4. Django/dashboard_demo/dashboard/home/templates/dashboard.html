<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #1e293b;
            color: #fff;
            padding: 30px 20px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #334155;
            color: #fff;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 40px;
        }

        .header {
            background: #fff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .profile-card {
            display: flex;
            gap: 30px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .profile-left {
            text-align: center;
            width: 250px;
            border-right: 1px solid #eee;
            padding-right: 20px;
        }

        .profile-left img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #3b82f6;
            margin-bottom: 15px;
        }

        .profile-left h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .profile-right {
            flex: 1;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }

        .info-box p {
            font-size: 13px;
            color: #777;
        }

        .info-box h4 {
            margin-top: 5px;
            color: #111;
            font-weight: 600;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        @media(max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                display: flex;
                justify-content: space-around;
            }

            .profile-card {
                flex-direction: column;
            }

            .profile-left {
                border-right: none;
                border-bottom: 1px solid #eee;
                padding-bottom: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>My Dashboard</h2>
        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header">
            <h2>Welcome, {{ user.name }}</h2>
        </div>

        <div class="profile-card">

            <div class="profile-left">
                <img src="{{ user.image.url }}">
                <h3>{{ user.display_name }}</h3>
                <p>{{ user.city }}</p>
            </div>

            <div class="profile-right">

                <div class="info-grid">

                    <div class="info-box">
                        <p>Email</p>
                        <h4>{{ user.email }}</h4>
                    </div>

                    <div class="info-box">
                        <p>Contact</p>
                        <h4>{{ user.contact }}</h4>
                    </div>

                    <div class="info-box">
                        <p>Date of Birth</p>
                        <h4>{{ user.dob }}</h4>
                    </div>

                    <div class="info-box">
                        <p>Joined On</p>
                        <h4>{{ user.joined_on }}</h4>
                    </div>

                </div>

                <div class="footer">
                    Profile information overview
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
