<html>
<head>
    <title> Home </title>

    <style>
        *{
            margin: 0;
        }
        body{
            text-align:center;
            font-family: Arial;
        }

        nav{
            background:#333;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        nav a:hover{
            text-decoration:underline;
        }

        form{
            margin-top:30px;
        }

        input{
            margin:10px;
            padding:6px;
        }

        button{
            padding:8px 15px;
        }
    </style>
</head>

<body>

    <nav>
        {% if user.is_authenticated %}
                <a href="/"> Home </a>
                <a href="/add/"> Add Student  </a>
                <a href="/student_list/"> Student List </a>
                <a> <b> Hello, {{ user.username }} </b> </a> 
                <a href="/logout/"> Logout </a>

            {% else %}
                <a href="/register/"> Register </a>
                <a href="/login/"> Login </a>
            {% endif %}
        </nav>

    <h1>Add Your Informations</h1>

    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name"><br>

        <label>Age:</label>
        <input type="number" name="age"><br>

        <label>Mobile:</label>
        <input type="tel" name="mobile"><br>

        <label>Email:</label>
        <input type="email" name="email"><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
