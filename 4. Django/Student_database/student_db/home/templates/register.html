<html>
    <head>
        <title> Register  </title>
        <style>
        *{
            margin: 0;
        }
        body{
            text-align:center;
            font-family: Arial;
        }

        nav{
            background:#333;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        nav a:hover{
            text-decoration:underline;
        }

        form{
            margin-top:30px;
        }

        input{
            margin:10px;
            padding:6px;
        }

        button{
            padding:8px 15px;
        }
    </style>
    </head>
    <body>

        <h1> Register Here </h1>
        <form method="POST">
            {% csrf_token %}
            Username:
            <input type="text" name="username"> <br><br> 

            Email:
            <input type="text" name="useremail"> <br><br> 

            Password:
            <input type="password" name="password"> <br><br> 

            <button type="submit"> Register </button>

        </form>
        <br>
        Already Register: <a href="/login/"> Click to Login </a>
    </body>
</html>
