<html>
    <head>
        <title> Edit </title>
        <style>
        *{
            margin: 0;
        }
        body{
            text-align:center;
            font-family: Arial;
        }

        nav{
            background:#333;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        nav a:hover{
            text-decoration:underline;
        }

        form{
            margin-top:30px;
        }

        input{
            margin:10px;
            padding:6px;
        }

        button{
            padding:8px 15px;
        }
    </style>
    </head>
    <body>
        <h1> You can Edit Your record!</h1>
        <form method="POST">
            {% csrf_token %}

            <label> Name: </label>
            <input type="text" name="name" value="{{ student.name }}">
            <br><br>
            <label> Age: </label>
            <input type="number" name="age" value="{{ student.age }}">
            <br><br>
            <label> Mobile: </label>
            <input type="tel" name="mobile" value="{{ student.mobile }}">
            <br><br>
            <label> Email: </label>
            <input type="email" name="email" value="{{ student.email }}">
            <br><br>
            <button type="submit"> Update Student </button>
        </form>
    </body>
</html>
