<html>
    <head>
        <title> Home </title>
        <style>
        *{
            margin: 0;
        }
        body{
            text-align:center;
            font-family: Arial;
        }

        nav{
            background:#333;
            padding:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        nav a:hover{
            text-decoration:underline;
        }

        form{
            margin-top:30px;
        }

        input{
            margin:10px;
            padding:6px;
        }

        button{
            padding:8px 15px;
        }
    </style>
    </head>
    <body>
        <nav>
            {% if user.is_authenticated %}
                <a href="/"> Home </a>
                <a href="/add/"> Add Student  </a>
                <a href="/student_list/"> Student List </a>
                <a> <b> Hello, {{ user.username }} </b> </a> 
                <a href="/logout/"> Logout </a>

            {% else %}
                <a href="/register/"> Register </a>
                <a href="/login/"> Login </a>
            {% endif %}
        </nav>
        <h1> Welcome to Student Management System </h1>
    </body>
</html>
