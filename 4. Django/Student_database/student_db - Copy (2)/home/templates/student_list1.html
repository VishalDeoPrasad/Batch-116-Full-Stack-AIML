<!DOCTYPE html>
<html>
<head>
    <title>Students Record</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #5b86e5;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #ddd;
            transition: 0.3s;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fc;
        }

        tbody tr:hover {
            background-color: #e3e9ff;
            transform: scale(1.01);
        }

        td {
            color: #555;
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tr {
                margin-bottom: 15px;
                background: #f8f9fc;
                padding: 10px;
                border-radius: 10px;
            }

            td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }

            td::before {
                content: attr(data-label);
                position: absolute;
                left: 15px;
                width: 45%;
                text-align: left;
                font-weight: bold;
                color: #333;
            }
        }
    </style>

</head>
<body>

    <h1>Students Record</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Mobile</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                    <tr>
                        <td data-label="Name">{{student.name}}</td>
                        <td data-label="Age">{{student.age}}</td>
                        <td data-label="Mobile">{{student.mobile}}</td>
                        <td data-label="Email">{{student.email}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
