<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }

        button {
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-3px);
        }
    </style>

</head>
<body>

    <div class="form-container">
        <h1>Add Your Informations</h1>
        <form method="POST">
            {% csrf_token %}

            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter your name">

            <label>Age:</label>
            <input type="number" name="age" placeholder="Enter your age">

            <label>Mobile:</label>
            <input type="tel" name="mobile" placeholder="Enter your mobile number">

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email">

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
