{% extends 'base.html' %}

{% block content %}

<h2>Students Record 📋</h2>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.mobile }}</td>
            <td>{{ student.email }}</td>
            <td>
                <a href="/edit/{{ student.id }}">Edit</a> |
                <a href="/delete/{{ student.id }}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No records found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
