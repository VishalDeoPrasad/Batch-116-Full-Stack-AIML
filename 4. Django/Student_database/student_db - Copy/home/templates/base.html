<!DOCTYPE html>
<html>
    <head>
        <title>Student Management System</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background: #f5f7fb;
            }

            nav {
                background: #2c3e50;
                padding: 12px;
                border-radius: 6px;
            }

            nav a {
                color: white;
                margin-right: 15px;
                text-decoration: none;
                font-weight: bold;
            }

            nav span {
                color: #f1c40f;
                font-weight: bold;
            }

            nav a:hover {
                text-decoration: underline;
            }

            hr {
                margin: 25px 0;
            }

            .container {
                background: white;
                padding: 25px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0,0,0,0.08);
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th {
                background: #34495e;
                color: white;
            }

            th, td {
                padding: 10px;
                text-align: left;
            }

            tr:nth-child(even) {
                background: #f2f2f2;
            }

            button {
                padding: 8px 16px;
                background: #27ae60;
                border: none;
                color: white;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background: #219150;
            }
        </style>
    </head>

    <body>

    <!-- 🔝 NAVBAR -->
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'add_student' %}">Add Student</a>
            <a href="{% url 'student_list' %}">Student List</a>
            <span>Hello, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>

    <hr>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    </body>
</html>
