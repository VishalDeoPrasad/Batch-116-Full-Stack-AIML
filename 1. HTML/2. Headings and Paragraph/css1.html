<!DOCTYPE html>
<html>
<head>
  <title>Landing Page</title>
  <style>
    body, html {
      background-color: #e65c00;
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .landing {
      height: 100vh;
      background: url('https://source.unsplash.com/1600x900/?nature') no-repeat center center/cover;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
    }

    .landing h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .landing p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .landing button {
      padding: 12px 25px;
      font-size: 16px;
      background: #ff6600;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    .landing button:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>

  <section class="landing">
    <h1>Welcome to Vishal's World</h1>
    <p>We build AI Based Web Applications </p>
    <button>Know More</button>
  </section>

</body>
</html>
