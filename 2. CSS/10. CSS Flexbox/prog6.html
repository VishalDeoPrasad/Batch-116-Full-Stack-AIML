<html>
    <head>
        <title> web </title>
        <style>
            .outerbox{
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: green;
                height: 500px;
            }
            .box{
                background-color: orange;
                width: 200px;
                height: 70px;
                margin: 10px;
            }
            .box1{ 
                flex-basis: 100px;
            }
            .box2{
                flex-basis: 200px;
            }
            .box3{
                flex-basis: 300px;
            }
        </style>
    </head>
    <body>
        <div class="outerbox">
            <div class="box box1" > 1 </div>
            <div class="box box2"> 2 </div>
            <div class="box box3"> 3 </div>
        </div>
    </body>
</html>
