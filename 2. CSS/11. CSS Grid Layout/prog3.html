<html>
    <head>
        <title> Manac </title>
        <style>
            .outerbox{
                display: grid;
                grid-template-columns: 4fr 1fr;
                grid-template-rows: repeat(2, 100px) ;
                gap: 20px;
            }
            .box{
                background-color: lightblue;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="outerbox">
            <div class="box"> 1 </div>
            <div class="box"> 2 </div>
            <div class="box"> 3 </div>
            <div class="box"> 4 </div>
        </div>
    </body>
</html>
