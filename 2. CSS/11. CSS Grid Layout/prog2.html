<html>
    <head>
        <title> Manac </title>
        <style>
            .outerbox{
                display: grid;
                grid-template-columns: 200px 200px 200px;
                grid-template-rows: 200px 200px 200px;
                gap: 20px;
            }
            .box{
                background-color: lightblue;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="outerbox">
            <div class="box"> 1 </div>
            <div class="box"> 2 </div>
            <div class="box"> 3 </div>
            <div class="box"> 4 </div>
            <div class="box"> 5 </div>
            <div class="box"> 6 </div>
            <div class="box"> 7 </div>
            <div class="box"> 8 </div>
            <div class="box"> 9 </div>
        </div>
    </body>
</html>
