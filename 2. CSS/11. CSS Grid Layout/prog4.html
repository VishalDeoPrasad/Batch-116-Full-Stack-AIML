<html>
    <head>
        <title> werb </title>
        <style>
            .outerbox{
                display: grid;
                grid-template-columns: repeat(3, 200px);
                grid-template-rows: repeat(4, 200px);
                gap: 20px;
                
            }
            .box{
                background-color: rgb(153, 172, 188);
                font-size: 60px;
            }
            .box1{
                grid-column: span 2;
            }
            .box3{
                grid-row: span 2;
            }
            .box9{
                grid-column: span 2;
            }
        </style>
    </head>
    <body>
        <div class="outerbox">
            <div class="box box1"> 1 </div>
            <div class="box"> 2 </div>
            <div class="box box3"> 3 </div>
            <div class="box"> 4 </div>
            <div class="box"> 5 </div>
            <div class="box"> 6 </div>
            <div class="box"> 7 </div>
            <div class="box"> 8 </div>
            <div class="box box9"> 9 </div>
        </div>
    </body>
</html>
