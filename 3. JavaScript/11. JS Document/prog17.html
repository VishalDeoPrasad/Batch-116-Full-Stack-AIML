<html>
    <head>
        <title> web </title>
        <style>
            body{
                text-align: center;
                background-color: aquamarine;
            }
        </style>
    </head>
    <body>
        <h1 id="output"> </h1>
        <h1 id="output1"> </h1>
        <h1 id="output2"> </h1>
        <script>
            function time(){
                let now = new Date;
                now_time = now.toLocaleTimeString();
                now_date = now.toLocaleDateString();
                now_day = now.toLocaleDateString('en-US',{weekday:'long'});
                
                document.getElementById('output').innerText = now_time;
                document.getElementById('output1').innerText = now_date;
                document.getElementById('output2').innerText = now_day;
            }
            setInterval(time, 1000);
        </script>
    </body>
</html>
