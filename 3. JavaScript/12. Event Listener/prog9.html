<html>
    <head>
        <title> web </title>
    </head>
    <body>
        <script>
            function keyTouch(){
                if (event.key == 'v'){
                    console.log("Vishal Kumar");
                }
                else if (event.key == 'm'){
                    console.log("Manac Infotech pvt Ltd");
                }
                else{
                    console.log("Key Pressed: ", event.key);
                }
            }
            document.addEventListener("keyup", keyTouch);
        </script>
    </body>
</html>
