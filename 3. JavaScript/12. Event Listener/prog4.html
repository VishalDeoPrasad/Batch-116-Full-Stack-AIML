<html>
    <head>
        <title> web </title>
        <style>
            #box{
                width: 300px;
                height: 300px;
                background-color: aqua;
            }
        </style>
    </head>
    <body>
        <div id="box"></div>
        <script>
            function changeBG(){
               box.style.background = "blue"; 
            }
            let box = document.getElementById("box");
            box.addEventListener("mouseover", changeBG);
        </script>
    </body>
</html>
