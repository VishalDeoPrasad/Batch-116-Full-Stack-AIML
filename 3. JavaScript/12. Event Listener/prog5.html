<html>
    <head>
        <title> web </title>
        <style>
            #box{
                width: 300px;
                height: 300px;
                background-color: aqua;
            }
        </style>
    </head>
    <body>
        <div id="box"></div>
        <script>
            function changeBlue(){
               box.style.background = "blue"; 
            }
            function changeAque(){
                box.style.background = "aqua";
            }
            let box = document.getElementById("box");
            box.addEventListener("mouseover", changeBlue);
            box.addEventListener("mouseout", changeAque);
        </script>
    </body>
</html>
