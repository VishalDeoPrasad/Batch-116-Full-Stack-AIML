<html>
    <head>
        <title> Manac </title>
    </head>
    <body>
        <script>
            let a = 10;
            let b = 20;
            let op = '/';
            switch(op){
                case '+':
                    console.log(a+b);
                    break;
                case '-':
                    console.log(a-b);
                    break;
                case '*':
                    console.log(a*b);
                    break;
                case '/':
                    console.log(a/b);
                    break;
                default:
                    console.log("Invalid operations");
            }
        </script>
    </body>
</html>
